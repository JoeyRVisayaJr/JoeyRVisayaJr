<svg xmlns="http://www.w3.org/2000/svg" width="340" height="80" viewBox="0 0 340 80" fill="none">
  <style>
    .sub { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #d1d5db; letter-spacing: 0.5px; }
    .title { font: 800 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; }
  </style>

  <!-- Border Box -->
  <rect x="1" y="1" width="338" height="78" rx="8" fill="#000000" stroke="#ffffff" stroke-width="1.8"/>

  <!-- Trophy Icon -->
  <g transform="translate(18, 16)">
    <!-- Trophy Cup -->
    <path d="M9 5 H31 V19 C31 25 25.5 30 20 30 C14.5 30 9 25 9 19 Z" fill="#000000" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Star Inside -->
    <polygon points="20,10 21.6,14.5 26,14.5 22.4,17.2 23.8,21.5 20,19 16.2,21.5 17.6,17.2 14,14.5 18.4,14.5" fill="#ffffff"/>
    <!-- Left Handle -->
    <path d="M9 9 H4 C2.5 9 1 10.5 1 12.5 V15 C1 17.5 2.5 19 4.5 19 H9" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Right Handle -->
    <path d="M31 9 H36 C37.5 9 39 10.5 39 12.5 V15 C39 17.5 37.5 19 35.5 19 H31" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Stem & Base -->
    <path d="M20 30 V39 M14 39 H26 M10 46 H30" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Content Text -->
  <text class="sub" x="72" y="32">EGOVPH HACKATHON 2026</text>
  <text class="title" x="72" y="54">#10 Finalist out of 270 Teams</text>
</svg>
