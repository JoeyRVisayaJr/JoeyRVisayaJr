<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" fill="none">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="header-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>
    <linearGradient id="bar-ts" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178C6"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="bar-js" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7DF1E"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>
    <linearGradient id="bar-cs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#239120"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="bar-py" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3776AB"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <style>
    .title { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .section-title { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #58a6ff; letter-spacing: 0.5px; }
    .label { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .val { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .lang-name { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .lang-pct { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
  </style>

  <!-- Main Card Container -->
  <rect x="0.5" y="0.5" width="519" height="269" rx="10" fill="url(#card-bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Terminal Window Header -->
  <path d="M0.5 10.5 C0.5 5 5 0.5 10.5 0.5 H509.5 C515 0.5 519.5 5 519.5 10.5 V34 H0.5 Z" fill="url(#header-bg)"/>
  <line x1="0" y1="34" x2="520" y2="34" stroke="#30363d" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="20" cy="17" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="17" r="5" fill="#ffbd2e"/>
  <circle cx="52" cy="17" r="5" fill="#27c93f"/>

  <!-- Header Title -->
  <text class="title" x="70" y="21">JoeyRVisayaJr &bull; Recent Habits &amp; Languages</text>

  <!-- Left Column: Recent Habits -->
  <g transform="translate(20, 50)">
    <text class="section-title" x="0" y="10">⚡ RECENT HABITS (14 DAYS)</text>

    <!-- Habit 1: Active Hours -->
    <g transform="translate(0, 24)">
      <circle cx="6" cy="6" r="3" fill="#3fb950"/>
      <text class="label" x="16" y="9">Active Hours:</text>
      <text class="val" x="100" y="9">14:00 – 23:00 (PHT)</text>
    </g>

    <!-- Habit 2: Active Days -->
    <g transform="translate(0, 48)">
      <circle cx="6" cy="6" r="3" fill="#58a6ff"/>
      <text class="label" x="16" y="9">Commit Rate:</text>
      <text class="val" x="100" y="9">Daily / High Momentum</text>
    </g>

    <!-- Habit 3: Focus Areas -->
    <g transform="translate(0, 72)">
      <circle cx="6" cy="6" r="3" fill="#bc8cff"/>
      <text class="label" x="16" y="9">Current Focus:</text>
      <text class="val" x="100" y="9">Web &amp; Mobile &bull; AI Workflows</text>
    </g>

    <!-- Habit 4: Active Workflows -->
    <g transform="translate(0, 96)">
      <circle cx="6" cy="6" r="3" fill="#d29922"/>
      <text class="label" x="16" y="9">Environment:</text>
      <text class="val" x="100" y="9">Full-Stack &bull; Offline-First</text>
    </g>

    <!-- Activity Mini Sparkline / Indicator -->
    <g transform="translate(0, 120)">
      <text class="label" x="0" y="8">Recent Activity:</text>
      <g transform="translate(100, 0)">
        <rect x="0" y="2" width="10" height="8" rx="2" fill="#238636"/>
        <rect x="14" y="0" width="10" height="10" rx="2" fill="#39d353"/>
        <rect x="28" y="3" width="10" height="7" rx="2" fill="#238636"/>
        <rect x="42" y="1" width="10" height="9" rx="2" fill="#39d353"/>
        <rect x="56" y="0" width="10" height="10" rx="2" fill="#39d353"/>
        <rect x="70" y="2" width="10" height="8" rx="2" fill="#238636"/>
        <rect x="84" y="0" width="10" height="10" rx="2" fill="#39d353"/>
        <rect x="98" y="1" width="10" height="9" rx="2" fill="#39d353"/>
        <rect x="112" y="0" width="10" height="10" rx="2" fill="#39d353"/>
      </g>
    </g>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="265" y1="46" x2="265" y2="200" stroke="#30363d" stroke-width="1"/>

  <!-- Right Column: Recent Languages -->
  <g transform="translate(285, 50)">
    <text class="section-title" x="0" y="10">🚀 RECENT LANGUAGES</text>

    <!-- Language Multi-Segment Progress Bar -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="215" height="10" rx="5" fill="#21262d"/>
      <rect x="0" y="0" width="90" height="10" rx="5" fill="url(#bar-ts)"/>
      <rect x="88" y="0" width="55" height="10" fill="url(#bar-js)"/>
      <rect x="141" y="0" width="35" height="10" fill="url(#bar-cs)"/>
      <rect x="174" y="0" width="24" height="10" fill="url(#bar-py)"/>
      <rect x="196" y="0" width="19" height="10" rx="5" fill="#e34c26"/>
    </g>

    <!-- Language Grid Breakdown -->
    <g transform="translate(0, 52)">
      <!-- Item 1: TypeScript -->
      <circle cx="5" cy="5" r="4.5" fill="#3178C6"/>
      <text class="lang-name" x="16" y="8">TypeScript</text>
      <text class="lang-pct" x="82" y="8">42.1%</text>

      <!-- Item 2: JavaScript -->
      <circle cx="115" cy="5" r="4.5" fill="#F7DF1E"/>
      <text class="lang-name" x="126" y="8">JavaScript</text>
      <text class="lang-pct" x="190" y="8">25.6%</text>
    </g>

    <g transform="translate(0, 78)">
      <!-- Item 3: C# / .NET -->
      <circle cx="5" cy="5" r="4.5" fill="#239120"/>
      <text class="lang-name" x="16" y="8">C# / .NET</text>
      <text class="lang-pct" x="82" y="8">16.3%</text>

      <!-- Item 4: Python -->
      <circle cx="115" cy="5" r="4.5" fill="#3776AB"/>
      <text class="lang-name" x="126" y="8">Python</text>
      <text class="lang-pct" x="190" y="8">10.2%</text>
    </g>

    <g transform="translate(0, 104)">
      <!-- Item 5: HTML / CSS -->
      <circle cx="5" cy="5" r="4.5" fill="#e34c26"/>
      <text class="lang-name" x="16" y="8">HTML / CSS</text>
      <text class="lang-pct" x="82" y="8">3.8%</text>

      <!-- Item 6: Shell -->
      <circle cx="115" cy="5" r="4.5" fill="#89e051"/>
      <text class="lang-name" x="126" y="8">Shell / SQL</text>
      <text class="lang-pct" x="190" y="8">2.0%</text>
    </g>
  </g>

  <!-- Bottom Accent / Status line -->
  <line x1="20" y1="225" x2="500" y2="225" stroke="#21262d" stroke-width="1"/>
  <text class="label" x="20" y="248">● Synchronized with GitHub Activity &bull; Updated Daily</text>
  <text class="label" x="430" y="248" fill="#58a6ff">Asia/Manila</text>
</svg>
