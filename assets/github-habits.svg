<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195" fill="none">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="bar-ts" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178C6"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="bar-js" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7DF1E"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>
    <linearGradient id="bar-cs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#239120"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="bar-py" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3776AB"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <style>
    .title { font: 700 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #58a6ff; letter-spacing: 0.5px; }
    .header-sub { font: 500 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .label { font: 500 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .val { font: 600 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .lang-name { font: 600 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .lang-pct { font: 400 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
  </style>

  <!-- Main Card Container -->
  <rect x="0.5" y="0.5" width="494" height="194" rx="5" fill="url(#card-bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(18, 20)">
    <text class="title" x="0" y="0">⚡ RECENT HABITS &amp; STACK</text>
    <text class="header-sub" x="460" y="0" text-anchor="end">14-Day Metrics</text>
  </g>
  <line x1="18" y1="28" x2="477" y2="28" stroke="#21262d" stroke-width="1"/>

  <!-- Left Column: Habits -->
  <g transform="translate(18, 38)">
    <!-- Habit 1: Active Hours -->
    <g transform="translate(0, 14)">
      <circle cx="5" cy="5" r="3" fill="#3fb950"/>
      <text class="label" x="14" y="8">Hours:</text>
      <text class="val" x="65" y="8">14:00 – 23:00 (PHT)</text>
    </g>

    <!-- Habit 2: Commit Rate -->
    <g transform="translate(0, 38)">
      <circle cx="5" cy="5" r="3" fill="#58a6ff"/>
      <text class="label" x="14" y="8">Rate:</text>
      <text class="val" x="65" y="8">Daily / High Momentum</text>
    </g>

    <!-- Habit 3: Focus -->
    <g transform="translate(0, 62)">
      <circle cx="5" cy="5" r="3" fill="#bc8cff"/>
      <text class="label" x="14" y="8">Focus:</text>
      <text class="val" x="65" y="8">Web &amp; Mobile &bull; AI</text>
    </g>

    <!-- Habit 4: Environment -->
    <g transform="translate(0, 86)">
      <circle cx="5" cy="5" r="3" fill="#d29922"/>
      <text class="label" x="14" y="8">Env:</text>
      <text class="val" x="65" y="8">Full-Stack &bull; Offline</text>
    </g>

    <!-- Mini Activity indicator -->
    <g transform="translate(0, 110)">
      <text class="label" x="0" y="8">Activity:</text>
      <g transform="translate(56, 1)">
        <rect x="0" y="2" width="8" height="7" rx="1.5" fill="#238636"/>
        <rect x="11" y="0" width="8" height="9" rx="1.5" fill="#39d353"/>
        <rect x="22" y="3" width="8" height="6" rx="1.5" fill="#238636"/>
        <rect x="33" y="0" width="8" height="9" rx="1.5" fill="#39d353"/>
        <rect x="44" y="0" width="8" height="9" rx="1.5" fill="#39d353"/>
        <rect x="55" y="2" width="8" height="7" rx="1.5" fill="#238636"/>
        <rect x="66" y="0" width="8" height="9" rx="1.5" fill="#39d353"/>
        <rect x="77" y="0" width="8" height="9" rx="1.5" fill="#39d353"/>
        <rect x="88" y="0" width="8" height="9" rx="1.5" fill="#39d353"/>
        <rect x="99" y="0" width="8" height="9" rx="1.5" fill="#39d353"/>
        <rect x="110" y="0" width="8" height="9" rx="1.5" fill="#39d353"/>
      </g>
    </g>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="245" y1="36" x2="245" y2="180" stroke="#21262d" stroke-width="1"/>

  <!-- Right Column: Recent Languages -->
  <g transform="translate(258, 38)">
    <text class="label" x="0" y="10" font-weight="600" fill="#c9d1d9">Top Recent Languages</text>

    <!-- Multi-Segment Bar -->
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="218" height="7" rx="3.5" fill="#21262d"/>
      <rect x="0" y="0" width="92" height="7" rx="3.5" fill="url(#bar-ts)"/>
      <rect x="90" y="0" width="56" height="7" fill="url(#bar-js)"/>
      <rect x="144" y="0" width="36" height="7" fill="url(#bar-cs)"/>
      <rect x="178" y="0" width="23" height="7" fill="url(#bar-py)"/>
      <rect x="199" y="0" width="19" height="7" rx="3.5" fill="#e34c26"/>
    </g>

    <!-- Languages Grid -->
    <g transform="translate(0, 40)">
      <!-- TypeScript -->
      <circle cx="5" cy="5" r="3.5" fill="#3178C6"/>
      <text class="lang-name" x="14" y="8">TypeScript</text>
      <text class="lang-pct" x="78" y="8">42.1%</text>

      <!-- JavaScript -->
      <circle cx="114" cy="5" r="3.5" fill="#F7DF1E"/>
      <text class="lang-name" x="123" y="8">JavaScript</text>
      <text class="lang-pct" x="182" y="8">25.6%</text>
    </g>

    <g transform="translate(0, 66)">
      <!-- C# -->
      <circle cx="5" cy="5" r="3.5" fill="#239120"/>
      <text class="lang-name" x="14" y="8">C# / .NET</text>
      <text class="lang-pct" x="78" y="8">16.3%</text>

      <!-- Python -->
      <circle cx="114" cy="5" r="3.5" fill="#3776AB"/>
      <text class="lang-name" x="123" y="8">Python</text>
      <text class="lang-pct" x="182" y="8">10.2%</text>
    </g>

    <g transform="translate(0, 92)">
      <!-- HTML / CSS -->
      <circle cx="5" cy="5" r="3.5" fill="#e34c26"/>
      <text class="lang-name" x="14" y="8">HTML / CSS</text>
      <text class="lang-pct" x="78" y="8">3.8%</text>

      <!-- Shell -->
      <circle cx="114" cy="5" r="3.5" fill="#89e051"/>
      <text class="lang-name" x="123" y="8">Shell / SQL</text>
      <text class="lang-pct" x="182" y="8">2.0%</text>
    </g>
  </g>
</svg>