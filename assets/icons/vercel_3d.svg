<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <radialGradient id="ver-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Base 3D Gradients -->
    <linearGradient id="ver-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="ver-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="ver-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="ver-bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Vercel Triangle 3D Gradients -->
    <linearGradient id="tri-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D4D4D4"/>
    </linearGradient>
    <linearGradient id="tri-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A3A3A3"/>
      <stop offset="100%" stop-color="#737373"/>
    </linearGradient>
    <linearGradient id="tri-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#737373"/>
      <stop offset="100%" stop-color="#404040"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="60" cy="104" rx="44" ry="12" fill="url(#ver-shadow)"/>

  <!-- 3D Isometric Tile / Base -->
  <path d="M16 48 L60 74 L60 88 L16 62 Z" fill="url(#ver-left)"/>
  <path d="M60 74 L104 48 L104 62 L60 88 Z" fill="url(#ver-right)"/>
  <path d="M60 22 L104 48 L60 74 L16 48 Z" fill="url(#ver-top)"/>
  <path d="M60 23 L102 48 L60 73 L18 48 Z" stroke="url(#ver-bevel)" stroke-width="1.2" fill="none"/>

  <!-- 3D Vercel Prism Triangle -->
  <g transform="translate(60, 48) scale(0.9) translate(-60, -48)">
    <!-- Shadow -->
    <polygon points="60,37 84,72 36,72" fill="#000000" opacity="0.4" transform="translate(0, 4)"/>
    <!-- Left Depth Face -->
    <polygon points="60,33 36,68 36,73 60,38" fill="url(#tri-left)"/>
    <!-- Right Depth Face -->
    <polygon points="60,33 84,68 84,73 60,38" fill="url(#tri-right)"/>
    <!-- Bottom Depth Face -->
    <polygon points="36,68 84,68 84,73 36,73" fill="#404040"/>
    <!-- Top Floating Face -->
    <polygon points="60,33 84,68 36,68" fill="url(#tri-top)"/>
  </g>
</svg>
