<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <radialGradient id="git-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="git-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40201a"/>
      <stop offset="100%" stop-color="#24100c"/>
    </linearGradient>
    <linearGradient id="git-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a140f"/>
      <stop offset="100%" stop-color="#140805"/>
    </linearGradient>
    <linearGradient id="git-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#210f0b"/>
      <stop offset="100%" stop-color="#0f0503"/>
    </linearGradient>
    <linearGradient id="git-bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F05032" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F05032" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="git-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#D83A1E"/>
    </linearGradient>
  </defs>

  <ellipse cx="60" cy="104" rx="44" ry="12" fill="url(#git-shadow)"/>

  <path d="M16 48 L60 74 L60 88 L16 62 Z" fill="url(#git-left)"/>
  <path d="M60 74 L104 48 L104 62 L60 88 Z" fill="url(#git-right)"/>
  <path d="M60 22 L104 48 L60 74 L16 48 Z" fill="url(#git-top)"/>
  <path d="M60 23 L102 48 L60 73 L18 48 Z" stroke="url(#git-bevel)" stroke-width="1.2" fill="none"/>

  <g transform="translate(60, 48) scale(0.9) translate(-60, -48)">
    <!-- 3D Git Diamond Base -->
    <rect x="42" y="30" width="36" height="36" rx="7" transform="rotate(45 60 48)" fill="url(#git-orange)"/>
    <!-- Git Branch Network -->
    <path d="M47 48 L73 48" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M60 48 L70 38" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="48" cy="48" r="4.5" fill="#FFFFFF"/>
    <circle cx="72" cy="48" r="4.5" fill="#FFFFFF"/>
    <circle cx="70" cy="38" r="4.5" fill="#FFFFFF"/>
  </g>
</svg>
