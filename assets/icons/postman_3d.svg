<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <radialGradient id="pm-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="pm-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40281c"/>
      <stop offset="100%" stop-color="#24140b"/>
    </linearGradient>
    <linearGradient id="pm-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a170c"/>
      <stop offset="100%" stop-color="#140a04"/>
    </linearGradient>
    <linearGradient id="pm-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#201108"/>
      <stop offset="100%" stop-color="#0e0602"/>
    </linearGradient>
    <linearGradient id="pm-bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6C37" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF6C37" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="pm-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8354"/>
      <stop offset="100%" stop-color="#FF6C37"/>
    </linearGradient>
  </defs>

  <ellipse cx="60" cy="104" rx="44" ry="12" fill="url(#pm-shadow)"/>

  <path d="M16 48 L60 74 L60 88 L16 62 Z" fill="url(#pm-left)"/>
  <path d="M60 74 L104 48 L104 62 L60 88 Z" fill="url(#pm-right)"/>
  <path d="M60 22 L104 48 L60 74 L16 48 Z" fill="url(#pm-top)"/>
  <path d="M60 23 L102 48 L60 73 L18 48 Z" stroke="url(#pm-bevel)" stroke-width="1.2" fill="none"/>

  <!-- 3D Postman Spaceman -->
  <g transform="translate(60, 48) scale(0.9) translate(-60, -48)">
    <circle cx="60" cy="48" r="22" fill="url(#pm-orange)"/>
    <path d="M52 44 C52 40 56 36 62 36 C68 36 71 40 71 44 C71 48 66 52 60 52 C55 52 52 48 52 44 Z" fill="#FFFFFF"/>
    <path d="M46 54 L58 48 L56 58 Z" fill="#FFFFFF"/>
    <circle cx="63" cy="43" r="2.5" fill="#FF6C37"/>
  </g>
</svg>
