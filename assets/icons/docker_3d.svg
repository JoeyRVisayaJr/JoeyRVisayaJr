<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <radialGradient id="dock-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Base 3D Gradients -->
    <linearGradient id="dock-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143b59"/>
      <stop offset="100%" stop-color="#0b2438"/>
    </linearGradient>
    <linearGradient id="dock-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2940"/>
      <stop offset="100%" stop-color="#061624"/>
    </linearGradient>
    <linearGradient id="dock-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2133"/>
      <stop offset="100%" stop-color="#040e17"/>
    </linearGradient>
    <linearGradient id="dock-bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2496ED" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2496ED" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="dock-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46a8f5"/>
      <stop offset="100%" stop-color="#1b78c4"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="60" cy="104" rx="44" ry="12" fill="url(#dock-shadow)"/>

  <!-- 3D Isometric Tile / Base -->
  <path d="M16 48 L60 74 L60 88 L16 62 Z" fill="url(#dock-left)"/>
  <path d="M60 74 L104 48 L104 62 L60 88 Z" fill="url(#dock-right)"/>
  <path d="M60 22 L104 48 L60 74 L16 48 Z" fill="url(#dock-top)"/>
  <path d="M60 23 L102 48 L60 73 L18 48 Z" stroke="url(#dock-bevel)" stroke-width="1.2" fill="none"/>

  <!-- 3D Docker Whale & Containers -->
  <g transform="translate(60, 48) scale(0.9) translate(-60, -48)">
    <!-- Containers Grid -->
    <g fill="url(#dock-blue)">
      <!-- Top Row -->
      <rect x="55" y="32" width="7" height="6" rx="1"/>
      <rect x="64" y="32" width="7" height="6" rx="1"/>
      <!-- Mid Row -->
      <rect x="46" y="40" width="7" height="6" rx="1"/>
      <rect x="55" y="40" width="7" height="6" rx="1"/>
      <rect x="64" y="40" width="7" height="6" rx="1"/>
      <rect x="73" y="40" width="7" height="6" rx="1"/>
      <!-- Bottom Row -->
      <rect x="37" y="48" width="7" height="6" rx="1"/>
      <rect x="46" y="48" width="7" height="6" rx="1"/>
      <rect x="55" y="48" width="7" height="6" rx="1"/>
      <rect x="64" y="48" width="7" height="6" rx="1"/>
      <rect x="73" y="48" width="7" height="6" rx="1"/>
    </g>

    <!-- Whale Body -->
    <path d="M30 56 C30 56 32 68 45 72 C58 76 77 74 85 64 C90 58 92 56 94 56 C95 56 97 59 97 59 C95 53 90 49 84 50 C84 50 83 49 81 50 C77 52 72 52 68 53 C56 53 36 53 30 56 Z" fill="url(#dock-blue)"/>
    <!-- Eye -->
    <circle cx="86" cy="59" r="1.5" fill="#ffffff"/>
    <!-- Spout / Water spray -->
    <circle cx="94" cy="45" r="1.5" fill="#60b5fa"/>
    <circle cx="98" cy="41" r="1.8" fill="#60b5fa"/>
  </g>
</svg>
