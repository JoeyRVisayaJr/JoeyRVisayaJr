<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Drop Shadow -->
    <radialGradient id="vs-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Base 3D Gradients -->
    <linearGradient id="vs-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007ACC"/>
      <stop offset="100%" stop-color="#005A9E"/>
    </linearGradient>
    <linearGradient id="vs-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#005A9E"/>
      <stop offset="100%" stop-color="#003B66"/>
    </linearGradient>
    <linearGradient id="vs-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#004C85"/>
      <stop offset="100%" stop-color="#002947"/>
    </linearGradient>
    <linearGradient id="vs-bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- VS Code Ribbon Gradients -->
    <linearGradient id="vs-r1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0098FF"/>
      <stop offset="100%" stop-color="#0066B8"/>
    </linearGradient>
    <linearGradient id="vs-r2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E1F2FE"/>
    </linearGradient>
    <linearGradient id="vs-r3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F9CF0"/>
      <stop offset="100%" stop-color="#0E70C0"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="60" cy="104" rx="44" ry="12" fill="url(#vs-shadow)"/>

  <!-- 3D Isometric Tile / Base -->
  <path d="M16 48 L60 74 L60 88 L16 62 Z" fill="url(#vs-left)"/>
  <path d="M60 74 L104 48 L104 62 L60 88 Z" fill="url(#vs-right)"/>
  <path d="M60 22 L104 48 L60 74 L16 48 Z" fill="url(#vs-top)"/>
  <path d="M60 23 L102 48 L60 73 L18 48 Z" stroke="url(#vs-bevel)" stroke-width="1.2" fill="none"/>

  <!-- 3D VS Code Logo with Depth -->
  <g transform="translate(60, 48) scale(0.9) translate(-60, -48)">
    <!-- Shadow extrusion -->
    <g transform="translate(0, 3)" opacity="0.4">
      <path d="M80 34 L66 45 L54 36 L43 45 L38 41 L37 43 L48 52 L37 61 L38 63 L43 59 L54 68 L66 59 L80 70 C82 71.5 84 70 84 68 V36 C84 34 82 32.5 80 34 Z" fill="#001830"/>
    </g>
    <!-- Back wing -->
    <path d="M80 34 L54 54 L66 63 L82 51 C83.5 50 84 48 84 46 V36 C84 34 82 32.5 80 34 Z" fill="#005A9E"/>
    <!-- Center ribbon crossing -->
    <path d="M80 70 L54 50 L43 59 L38 55 L37 57 L48 66 L80 70 Z" fill="#007ACC"/>
    <path d="M43 45 L38 49 L37 47 L48 38 L80 34 L54 54 L43 45 Z" fill="url(#vs-r3)"/>
    <!-- Main glowing ribbon -->
    <path d="M80 70 C82 71.5 84 70 84 68 V56 C84 54 83 52.5 81.5 51.5 L60 35 L43 48 L80 70 Z" fill="url(#vs-r2)" opacity="0.95"/>
    <path d="M80 70 L52 48 L65 38 L82 51 C83.5 52 84 54 84 56 V68 C84 70 82 71.5 80 70 Z" fill="url(#vs-r1)"/>
  </g>
</svg>
