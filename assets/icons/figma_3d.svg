<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <radialGradient id="fig-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Base 3D Gradients -->
    <linearGradient id="fig-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2438"/>
      <stop offset="100%" stop-color="#191522"/>
    </linearGradient>
    <linearGradient id="fig-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d1828"/>
      <stop offset="100%" stop-color="#0e0a14"/>
    </linearGradient>
    <linearGradient id="fig-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#171320"/>
      <stop offset="100%" stop-color="#08060c"/>
    </linearGradient>
    <linearGradient id="fig-bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="60" cy="104" rx="44" ry="12" fill="url(#fig-shadow)"/>

  <!-- 3D Isometric Tile / Base -->
  <path d="M16 48 L60 74 L60 88 L16 62 Z" fill="url(#fig-left)"/>
  <path d="M60 74 L104 48 L104 62 L60 88 Z" fill="url(#fig-right)"/>
  <path d="M60 22 L104 48 L60 74 L16 48 Z" fill="url(#fig-top)"/>
  <path d="M60 23 L102 48 L60 73 L18 48 Z" stroke="url(#fig-bevel)" stroke-width="1.2" fill="none"/>

  <!-- 3D Figma Components -->
  <g transform="translate(60, 48) scale(0.85) translate(-60, -48)">
    <!-- 3D Dropshadow under logo -->
    <g transform="translate(0, 3)" opacity="0.3">
      <rect x="42" y="27" width="18" height="18" rx="9" fill="#000000"/>
      <rect x="60" y="27" width="18" height="18" rx="9" fill="#000000"/>
      <rect x="42" y="45" width="18" height="18" rx="9" fill="#000000"/>
      <circle cx="69" cy="54" r="9" fill="#000000"/>
      <path d="M42 63 H60 V72 C60 77 56 81 51 81 C46 81 42 77 42 72 Z" fill="#000000"/>
    </g>

    <!-- Top Left (Orange-Red #F24E1E) -->
    <path d="M51 27 H60 V45 H51 C46 45 42 41 42 36 C42 31 46 27 51 27 Z" fill="#F24E1E"/>
    <!-- Top Right (Orange #FF7262) -->
    <path d="M60 27 H69 C74 27 78 31 78 36 C78 41 74 45 69 45 H60 V27 Z" fill="#FF7262"/>
    <!-- Middle Left (Purple #A259FF) -->
    <path d="M51 45 H60 V63 H51 C46 63 42 59 42 54 C42 49 46 45 51 45 Z" fill="#A259FF"/>
    <!-- Middle Right (Cyan #1ABCFE) -->
    <circle cx="69" cy="54" r="9" fill="#1ABCFE"/>
    <!-- Bottom Left (Green #0ACF83) -->
    <path d="M42 63 H60 V72 C60 77 56 81 51 81 C46 81 42 77 42 72 Z" fill="#0ACF83"/>
  </g>
</svg>
