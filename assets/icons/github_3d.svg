<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Drop Shadow -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Base 3D Gradients -->
    <linearGradient id="gh-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d333b"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="gh-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f242c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="gh-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d12"/>
    </linearGradient>

    <!-- Bevel highlight -->
    <linearGradient id="gh-bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Icon 3D Gradient -->
    <linearGradient id="gh-logo-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9d1d9"/>
    </linearGradient>
    <linearGradient id="gh-logo-depth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b949e"/>
      <stop offset="100%" stop-color="#484f58"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="60" cy="104" rx="44" ry="12" fill="url(#shadow)"/>

  <!-- 3D Isometric Tile / Base -->
  <!-- Left Extrusion -->
  <path d="M16 48 L60 74 L60 88 L16 62 Z" fill="url(#gh-left)"/>
  <!-- Right Extrusion -->
  <path d="M60 74 L104 48 L104 62 L60 88 Z" fill="url(#gh-right)"/>
  <!-- Top Face -->
  <path d="M60 22 L104 48 L60 74 L16 48 Z" fill="url(#gh-top)"/>
  <!-- Bevel Highlight -->
  <path d="M60 23 L102 48 L60 73 L18 48 Z" stroke="url(#gh-bevel)" stroke-width="1.2" fill="none"/>

