<svg xmlns="http://www.w3.org/2000/svg" width="340" height="80" viewBox="0 0 340 80" fill="none">
  <style>
    .sub { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #d1d5db; letter-spacing: 0.5px; }
    .title { font: 800 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; }
  </style>

  <!-- Border Box -->
  <rect x="1" y="1" width="338" height="78" rx="8" fill="#000000" stroke="#ffffff" stroke-width="1.8"/>

  <!-- Lightbulb / Gear Icon -->
  <g transform="translate(18, 14)">
    <!-- Bulb Glass -->
    <path d="M12 18 C7 14 6 7 11 3 C16 -1 24 -1 29 3 C34 7 33 14 28 18 C26.5 19.5 25.5 22 25.5 24 H14.5 C14.5 22 13.5 19.5 12 18 Z" stroke="#ffffff" stroke-width="1.8" fill="#000000" stroke-linejoin="round"/>
    <!-- Filament Lines -->
    <path d="M17 10 V14 M23 10 V14 M17 14 H23" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Gear Base -->
    <path d="M12 28 H28 L27 34 H13 Z" stroke="#ffffff" stroke-width="1.6" fill="#000000"/>
    <path d="M15 38 H25 M18 42 H22" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Gear Teeth Accents -->
    <path d="M9 31 H12 M28 31 H31 M6 25 L9 27 M34 25 L31 27 M6 37 L9 35 M34 37 L31 35" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Content Text -->
  <text class="sub" x="72" y="32">UMAK HACKATHON 2024</text>
  <text class="title" x="72" y="54">Most Commercially Viable</text>
</svg>
